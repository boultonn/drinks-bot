<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management - Drinks Bot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍹</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #0d0d0f;
      --surface:      #15151a;
      --surface-2:    #1c1c23;
      --border:       #2a2a35;
      --border-light: #3a3a48;
      --gold:         #c9903a;
      --gold-light:   #e8b96a;
      --amber:        #f0c97a;
      --gold-dim:     rgba(201,144,58,0.15);
      --success:      #3ecf8e;
      --success-dim:  rgba(62,207,142,0.12);
      --danger:       #e55c5c;
      --danger-dim:   rgba(229,92,92,0.12);
      --warning:      #e8a83a;
      --warning-dim:  rgba(232,168,58,0.12);
      --blue:         #5b8dee;
      --blue-dim:     rgba(91,141,238,0.12);
      --text:         #e8e4dc;
      --text-muted:   #7a7870;
      --text-dim:     #4a4845;
      --shadow:       rgba(0,0,0,0.5);
    }

    html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

    #bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35; pointer-events: none; z-index: 1;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(201,144,58,0.05) 0%, transparent 70%);
      pointer-events: none; z-index: 1;
    }

    /* ── NAV ── */
    .global-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,13,15,0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-container {
      max-width: 1400px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 68px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700;
    }
    .nav-brand-icon {
      width: 34px; height: 34px;
      background: var(--gold-dim); border: 1px solid rgba(201,144,58,0.3); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; color: var(--gold-light);
    }
    .nav-brand-icon svg { width: 18px; height: 18px; }
    .nav-links { display: flex; gap: 4px; list-style: none; }
    .nav-link {
      padding: 8px 16px; color: var(--text-muted); text-decoration: none;
      border-radius: 8px; font-size: 0.875rem; font-weight: 500;
      transition: all 0.2s; border: 1px solid transparent;
    }
    .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .nav-link.active { color: var(--gold-light); background: var(--gold-dim); border-color: rgba(201,144,58,0.25); }

    /* ── LAYOUT ── */
    .container { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 40px 24px; }

    /* ── PAGE HEADER ── */
    .page-header { margin-bottom: 36px; }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; color: var(--text);
      margin-bottom: 4px;
    }
    .page-subtitle { color: var(--text-muted); font-size: 0.9rem; font-weight: 300; }

    /* ── STAT CARDS ── */
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 36px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 24px;
      position: relative; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .stat-card.pending::before { background: linear-gradient(90deg, var(--warning), transparent); }
    .stat-card.ready::before   { background: linear-gradient(90deg, var(--success), transparent); }
    .stat-card.completed::before { background: linear-gradient(90deg, var(--text-muted), transparent); }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; margin-bottom: 8px; }
    .stat-card.pending .stat-label { color: var(--warning); }
    .stat-card.ready   .stat-label { color: var(--success); }
    .stat-card.completed .stat-label { color: var(--text-muted); }
    .stat-number { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--text); }

    /* ── SECTIONS ── */
    .orders-section { margin-bottom: 36px; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700;
      color: var(--text); display: flex; align-items: center; gap: 10px;
    }
    .section-title-icon { font-size: 1rem; }
    .section-badge {
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-muted); padding: 2px 10px; border-radius: 12px;
      font-size: 0.75rem; font-weight: 600; font-family: 'DM Sans', sans-serif;
    }

    /* ── ORDER CARDS ── */
    .orders-grid { display: grid; gap: 10px; }
    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid;
      border-radius: 12px; padding: 18px 20px;
      display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .order-card:hover { transform: translateX(3px); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .pending-orders .order-card  { border-left-color: var(--warning); }
    .ready-orders .order-card    { border-left-color: var(--success); }
    .completed-orders .order-card { border-left-color: var(--text-dim); opacity: 0.7; }

    .order-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .order-field { display: flex; flex-direction: column; gap: 3px; }
    .field-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--text-dim); }
    .field-value { font-size: 0.9rem; color: var(--text-muted); font-weight: 400; }
    .field-value.name { color: var(--text); font-weight: 500; }
    .field-value.drink { color: var(--gold-light); font-weight: 600; font-size: 0.95rem; }
    .field-value.id { color: var(--text-dim); font-family: monospace; font-size: 0.85rem; }

    .email-status { cursor: pointer; padding: 2px 6px; border-radius: 5px; transition: background 0.2s; }
    .email-status:hover { background: rgba(255,255,255,0.05); }
    .order-time { cursor: help; }

    /* ── ACTION BUTTONS ── */
    .order-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      padding: 8px 16px; border: none; border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-ready   { background: var(--success-dim); color: var(--success); border: 1px solid rgba(62,207,142,0.25); }
    .btn-ready:hover   { background: var(--success); color: #0d0d0f; transform: translateY(-1px); }
    .btn-complete { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(91,141,238,0.25); }
    .btn-complete:hover { background: var(--blue); color: #0d0d0f; transform: translateY(-1px); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 48px 20px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.25; }
    .empty-text { color: var(--text-dim); font-size: 0.9rem; }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .order-card { grid-template-columns: 1fr; }
      .order-actions { flex-direction: row; }
      .section-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
    @media (max-width: 500px) {
      .nav-container { height: auto; flex-direction: column; padding: 16px; gap: 16px; }
      .nav-links { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <canvas id="bubbles"></canvas>

  <nav class="global-nav">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <div class="nav-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 22h8M12 16v6M5 3l7 9 7-9H5z"/><path d="M5 3h14"/><path d="M9 10.5c1 1 3 1 4 0"/>
          </svg>
        </div>
        Drinks Bot
      </a>
      <ul class="nav-links">
        <li><a href="/orders" class="nav-link active">Orders</a></li>
        <li><a href="/status" class="nav-link">Ready Display</a></li>
        <li><a href="/admin" class="nav-link">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Order Management</h1>
      <p class="page-subtitle">Track and manage all drink orders in real-time</p>
    </div>

    <div class="stats-container">
      <div class="stat-card pending">
        <div class="stat-label">Pending</div>
        <div class="stat-number" id="pendingCount">0</div>
      </div>
      <div class="stat-card ready">
        <div class="stat-label">Ready</div>
        <div class="stat-number" id="readyCount">0</div>
      </div>
      <div class="stat-card completed">
        <div class="stat-label">Completed</div>
        <div class="stat-number" id="completedCount">0</div>
      </div>
    </div>

    <!-- Pending -->
    <div class="orders-section pending-orders">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title-icon">⏳</span>
          Pending Orders
          <span class="section-badge" id="pendingBadge">0</span>
        </h2>
      </div>
      <div class="orders-grid" id="pendingOrders">
        <div class="empty-state"><div class="empty-icon">🎉</div><p class="empty-text">No pending orders</p></div>
      </div>
    </div>

    <!-- Ready -->
    <div class="orders-section ready-orders">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title-icon">✅</span>
          Ready for Collection
          <span class="section-badge" id="readyBadge">0</span>
        </h2>
      </div>
      <div class="orders-grid" id="readyOrders">
        <div class="empty-state"><div class="empty-icon">🍹</div><p class="empty-text">No orders ready</p></div>
      </div>
    </div>

    <!-- Completed -->
    <div class="orders-section completed-orders">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-title-icon">🎊</span>
          Completed
          <span class="section-badge" id="completedBadge">0</span>
        </h2>
      </div>
      <div class="orders-grid" id="completedOrders">
        <div class="empty-state"><div class="empty-icon">✨</div><p class="empty-text">No completed orders</p></div>
      </div>
    </div>
  </div>

  <script>
    // ── Bubbles ──
    const canvas = document.getElementById('bubbles');
    const ctx = canvas.getContext('2d');
    function resizeBubbles() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resizeBubbles(); window.addEventListener('resize', resizeBubbles);
    const bubbles = Array.from({length: 22}, () => spawnBubble(true));
    function spawnBubble(init=false) {
      return { x: Math.random()*innerWidth, y: init?Math.random()*innerHeight:innerHeight+10,
               r: 1.5+Math.random()*3, speed: 0.25+Math.random()*0.55,
               drift: (Math.random()-0.5)*0.2, opacity: 0.04+Math.random()*0.08 };
    }
    function tickBubbles() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(const b of bubbles){ b.y-=b.speed; b.x+=b.drift; if(b.y+b.r<0) Object.assign(b,spawnBubble());
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
        ctx.strokeStyle=`rgba(201,144,58,${b.opacity})`; ctx.lineWidth=1; ctx.stroke(); }
      requestAnimationFrame(tickBubbles);
    }
    tickBubbles();

    // ── Orders ──
    let orders = [];

    async function loadOrders() {
      try {
        const r = await fetch('/api/orders');
        orders = await r.json();
        displayOrders();
      } catch(e) { console.error('Error loading orders:', e); }
    }

    function formatOrderTime(timestamp) {
      const d = new Date(timestamp), now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      const full = d.toLocaleString();
      return {
        display: isToday ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : d.toLocaleDateString(),
        tooltip: full
      };
    }

    function displayOrders() {
      const pending   = orders.filter(o => o.status === 'pending');
      const ready     = orders.filter(o => o.status === 'ready');
      const completed = orders.filter(o => o.status === 'completed');

      document.getElementById('pendingCount').textContent   = pending.length;
      document.getElementById('readyCount').textContent     = ready.length;
      document.getElementById('completedCount').textContent = completed.length;
      document.getElementById('pendingBadge').textContent   = pending.length;
      document.getElementById('readyBadge').textContent     = ready.length;
      document.getElementById('completedBadge').textContent = completed.length;

      displaySection('pendingOrders',   pending,   'pending');
      displaySection('readyOrders',     ready,     'ready');
      displaySection('completedOrders', completed, 'completed');
    }

    function displaySection(containerId, list, status) {
      const el = document.getElementById(containerId);
      if (list.length === 0) {
        const msgs = {
          pending:   {icon:'🎉', text:'No pending orders'},
          ready:     {icon:'🍹', text:'No orders ready'},
          completed: {icon:'✨', text:'No completed orders'}
        };
        const m = msgs[status];
        el.innerHTML = `<div class="empty-state"><div class="empty-icon">${m.icon}</div><p class="empty-text">${m.text}</p></div>`;
        return;
      }
      el.innerHTML = list.map(order => {
        const t = formatOrderTime(order.timestamp);
        return `
          <div class="order-card">
            <div class="order-info">
              <div class="order-field"><div class="field-label">Order #</div><div class="field-value id">${order.id}</div></div>
              <div class="order-field"><div class="field-label">Name</div><div class="field-value name">${order.name}</div></div>
              <div class="order-field"><div class="field-label">Drink</div><div class="field-value drink">${order.drink}</div></div>
              <div class="order-field">
                <div class="field-label">Email</div>
                <div class="field-value">
                  ${order.email ? `<span class="email-status" onclick="showEmail('${order.email}')" title="Click to view">✅</span>` : `<span class="email-status">❌</span>`}
                </div>
              </div>
              <div class="order-field"><div class="field-label">Ordered</div><div class="field-value order-time" title="${t.tooltip}">${t.display}</div></div>
            </div>
            <div class="order-actions">
              ${status === 'pending' ? `
                <button class="btn btn-ready"    onclick="markReady(${order.id})">Ready</button>
                <button class="btn btn-complete" onclick="markComplete(${order.id})">Complete</button>` : ''}
              ${status === 'ready' ? `
                <button class="btn btn-complete" onclick="markComplete(${order.id})">Complete</button>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    function showEmail(email) { alert(`Email: ${email}`); }

    async function markReady(id) {
      try {
        const r = await fetch(`/api/orders/${id}/ready`, {method:'PUT'});
        if (r.ok) loadOrders(); else alert('Error marking order as ready');
      } catch(e) { alert('Error marking order as ready'); }
    }

    async function markComplete(id) {
      try {
        const r = await fetch(`/api/orders/${id}/complete`, {method:'PUT'});
        if (r.ok) loadOrders(); else alert('Error marking order as complete');
      } catch(e) { alert('Error marking order as complete'); }
    }

    loadOrders();
    setInterval(loadOrders, 30000);
  </script>
</body>
</html>
