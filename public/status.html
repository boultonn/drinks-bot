<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ready for Collection - Drinks Bot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍹</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #0d0d0f;
      --surface:      #15151a;
      --surface-2:    #1c1c23;
      --border:       #2a2a35;
      --border-light: #3a3a48;
      --gold:         #c9903a;
      --gold-light:   #e8b96a;
      --amber:        #f0c97a;
      --gold-dim:     rgba(201,144,58,0.15);
      --success:      #3ecf8e;
      --success-dim:  rgba(62,207,142,0.12);
      --text:         #e8e4dc;
      --text-muted:   #7a7870;
      --text-dim:     #4a4845;
      --shadow:       rgba(0,0,0,0.5);
    }

    html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

    #bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35; pointer-events: none; z-index: 1;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(62,207,142,0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 1;
    }

    /* ── NAV ── */
    .global-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,13,15,0.9); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border);
    }
    .nav-container {
      max-width: 1400px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 68px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700;
    }
    .nav-brand-icon {
      width: 34px; height: 34px;
      background: var(--gold-dim); border: 1px solid rgba(201,144,58,0.3); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; color: var(--gold-light);
    }
    .nav-brand-icon svg { width: 18px; height: 18px; }
    .nav-links { display: flex; gap: 4px; list-style: none; }
    .nav-link {
      padding: 8px 16px; color: var(--text-muted); text-decoration: none;
      border-radius: 8px; font-size: 0.875rem; font-weight: 500;
      transition: all 0.2s; border: 1px solid transparent;
    }
    .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .nav-link.active { color: var(--gold-light); background: var(--gold-dim); border-color: rgba(201,144,58,0.25); }

    /* ── LAYOUT ── */
    .container { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 40px 24px 60px; }

    /* ── PAGE HEADER ── */
    .page-header { text-align: center; margin-bottom: 40px; }

    .page-icon-wrap {
      width: 72px; height: 72px; margin: 0 auto 1.25rem;
      background: var(--success-dim); border: 1px solid rgba(62,207,142,0.25);
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      color: var(--success);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .page-icon-wrap svg { width: 34px; height: 34px; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(62,207,142,0); }
      50%  { box-shadow: 0 0 0 10px rgba(62,207,142,0); transform: scale(1.03); }
    }

    .page-eyebrow {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--success); margin-bottom: 0.6rem;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; color: var(--text);
      margin-bottom: 0.5rem;
    }

    .page-subtitle { color: var(--text-muted); font-size: 0.9rem; font-weight: 300; margin-bottom: 1.25rem; }

    .divider {
      width: 36px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--success), transparent);
      margin: 0 auto 1.5rem;
    }

    .ready-count {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--success-dim); border: 1px solid rgba(62,207,142,0.25);
      color: var(--success); padding: 10px 24px; border-radius: 50px;
      font-size: 0.9rem; font-weight: 600; letter-spacing: 0.04em;
    }

    /* ── ORDERS GRID ── */
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px; margin-top: 36px;
    }

    /* ── ORDER CARD ── */
    .order-card {
      background: var(--surface);
      border: 1px solid rgba(62,207,142,0.2);
      border-radius: 18px; padding: 28px;
      position: relative; overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .order-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--success), var(--amber));
    }

    .order-card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(62,207,142,0.12); }

    /* order number badge */
    .order-number {
      position: absolute; top: 18px; right: 18px;
      background: var(--success-dim); border: 1px solid rgba(62,207,142,0.25);
      color: var(--success); width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700;
    }

    /* cocktail icon */
    .order-drink-icon {
      width: 56px; height: 56px; margin: 0 auto 1rem;
      background: var(--gold-dim); border: 1px solid rgba(201,144,58,0.2);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      color: var(--gold-light);
    }
    .order-drink-icon svg { width: 26px; height: 26px; }

    .order-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem; font-weight: 700; color: var(--text);
      text-align: center; margin-bottom: 12px; word-wrap: break-word;
    }

    .order-drink {
      font-size: 1rem; color: var(--gold-light); font-weight: 600;
      text-align: center; padding: 10px 16px;
      background: var(--gold-dim); border: 1px solid rgba(201,144,58,0.2);
      border-radius: 10px; margin-bottom: 12px;
    }

    .order-time { text-align: center; color: var(--text-dim); font-size: 0.8rem; }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 80px 20px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    }
    .empty-icon-wrap {
      width: 80px; height: 80px; margin: 0 auto 1.5rem;
      background: var(--gold-dim); border: 1px solid rgba(201,144,58,0.15);
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      color: var(--gold); opacity: 0.4;
      animation: float 3s ease-in-out infinite;
    }
    .empty-icon-wrap svg { width: 36px; height: 36px; }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-12px); } }
    .empty-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
    .empty-text { color: var(--text-dim); font-size: 0.9rem; }

    /* ── MOBILE ── */
    @media (max-width: 768px) { .orders-grid { grid-template-columns: 1fr; } }
    @media (max-width: 500px) {
      .nav-container { height: auto; flex-direction: column; padding: 16px; gap: 16px; }
      .nav-links { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <canvas id="bubbles"></canvas>

  <nav class="global-nav">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <div class="nav-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 22h8M12 16v6M5 3l7 9 7-9H5z"/><path d="M5 3h14"/><path d="M9 10.5c1 1 3 1 4 0"/>
          </svg>
        </div>
        Drinks Bot
      </a>
      <ul class="nav-links">
        <li><a href="/orders" class="nav-link">Orders</a></li>
        <li><a href="/status" class="nav-link active">Ready Display</a></li>
        <li><a href="/admin" class="nav-link">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div class="page-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <p class="page-eyebrow">Bar Status</p>
      <h1 class="page-title">Ready for Collection</h1>
      <p class="page-subtitle">Your drinks are waiting at the bar</p>
      <div class="divider"></div>
      <div class="ready-count" id="readyCount">0 drinks ready</div>
    </div>

    <div class="orders-grid" id="ordersGrid">
      <div class="empty-state">
        <div class="empty-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 22h8M12 16v6M5 3l7 9 7-9H5z"/><path d="M5 3h14"/><path d="M9 10.5c1 1 3 1 4 0"/>
          </svg>
        </div>
        <h2 class="empty-title">No Orders Ready</h2>
        <p class="empty-text">Drinks will appear here when they're ready for collection</p>
      </div>
    </div>
  </div>

  <script>
    // ── Bubbles ──
    const canvas = document.getElementById('bubbles');
    const ctx = canvas.getContext('2d');
    function resizeBubbles() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resizeBubbles(); window.addEventListener('resize', resizeBubbles);
    const bubbles = Array.from({length: 32}, () => spawnBubble(true));
    function spawnBubble(init=false) {
      return { x: Math.random()*innerWidth, y: init?Math.random()*innerHeight:innerHeight+10,
               r: 1.5+Math.random()*4, speed: 0.3+Math.random()*0.65,
               drift: (Math.random()-0.5)*0.25, opacity: 0.05+Math.random()*0.1 };
    }
    function tickBubbles() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(const b of bubbles){ b.y-=b.speed; b.x+=b.drift; if(b.y+b.r<0) Object.assign(b,spawnBubble());
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
        ctx.strokeStyle=`rgba(201,144,58,${b.opacity})`; ctx.lineWidth=1; ctx.stroke(); }
      requestAnimationFrame(tickBubbles);
    }
    tickBubbles();

    // ── Orders ──
    let orders = [];

    async function loadReadyOrders() {
      try {
        const r = await fetch('/api/orders/ready');
        const newOrders = await r.json();
        const changed = JSON.stringify(orders) !== JSON.stringify(newOrders);
        orders = newOrders;
        displayOrders(changed);
      } catch(e) { console.error('Error loading ready orders:', e); }
    }

    function displayOrders(animate = false) {
      const grid = document.getElementById('ordersGrid');
      const badge = document.getElementById('readyCount');
      const count = orders.length;
      badge.textContent = count === 1 ? '1 drink ready' : `${count} drinks ready`;

      if (orders.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 22h8M12 16v6M5 3l7 9 7-9H5z"/><path d="M5 3h14"/><path d="M9 10.5c1 1 3 1 4 0"/>
              </svg>
            </div>
            <h2 class="empty-title">No Orders Ready</h2>
            <p class="empty-text">Drinks will appear here when they're ready for collection</p>
          </div>`;
        return;
      }

      grid.innerHTML = orders.map((order, i) => {
        const t = new Date(order.timestamp);
        const timeAgo = getTimeAgo(t);
        return `
          <div class="order-card" style="animation-delay:${animate ? i * 0.08 : 0}s">
            <div class="order-number">#${order.id}</div>
            <div class="order-drink-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 22h8M12 16v6M5 3l7 9 7-9H5z"/><path d="M5 3h14"/><path d="M9 10.5c1 1 3 1 4 0"/>
              </svg>
            </div>
            <div class="order-name">${order.name}</div>
            <div class="order-drink">${order.drink}</div>
            <div class="order-time">Ready ${timeAgo}</div>
          </div>`;
      }).join('');
    }

    function getTimeAgo(date) {
      const mins = Math.floor((Date.now() - date) / 60000);
      if (mins < 1) return 'just now';
      if (mins === 1) return '1 minute ago';
      if (mins < 60) return `${mins} minutes ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs === 1) return '1 hour ago';
      if (hrs < 24) return `${hrs} hours ago`;
      return date.toLocaleDateString();
    }

    loadReadyOrders();
    setInterval(loadReadyOrders, 15000);
  </script>
</body>
</html>
